name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    # 与本地 `make check` 完全同源：format-check + lint + types + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync

      - name: Gates (format / lint / types / tests with 90% coverage gate)
        run: make check

      - name: Upload coverage report
        if: always()
        run: uv run pytest --cov=src/opencode_client --cov-report=term-missing || true
